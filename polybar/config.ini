; Minimal polybar for i3
; Theme is loaded from theme.ini (change it with scripts/theme.sh)

include-file = ~/.config/polybar/theme.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 26
offset-x = 0
offset-y = 0

background = ${color.background}
foreground = ${color.foreground}

line-size = 2
line-color = ${color.primary}

padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1

font-0 = "DejaVu Sans Mono:size=9;2"

modules-left = i3
modules-center = date
modules-right = xkeyboard network pulseaudio battery

tray-position = right
tray-padding = 1
tray-maxsize = 14
tray-background = ${color.background}

enable-ipc = true
override-redirect = false

[module/i3]
type = internal/i3
format = <label-state>
pin-workspaces = true

label-focused = %name%
label-focused-foreground = ${color.primary}
label-focused-underline = ${color.primary}
label-focused-padding = 1

label-visible = %name%
label-visible-foreground = ${color.foreground}
label-visible-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${color.muted}
label-unfocused-padding = 1

label-urgent = %name%
label-urgent-foreground = ${color.urgent}
label-urgent-padding = 1

[module/date]
type = internal/date
interval = 1
time = %H:%M
time-alt = %a %d %b
format = <label>
label = %time%

[module/xkeyboard]
type = internal/xkeyboard
format = <label-layout>
label-layout = %layout%
label-layout-foreground = ${color.muted}

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 10
format = <label>
label = %output%
label-foreground = ${color.muted}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = %percentage%%
label-muted = muted
label-muted-foreground = ${color.muted}
scroll-up = pactl set-sink-volume @DEFAULT_SINK@ +5%
scroll-down = pactl set-sink-volume @DEFAULT_SINK@ -5%
click-left = pactl set-sink-mute @DEFAULT_SINK@ toggle

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery.sh
interval = 30
format = <label>
label = %output%
